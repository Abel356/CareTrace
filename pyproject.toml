[project]
name = "caretrace-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[dependency-groups]
dev = [
    "mypy>=1.19,<3",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]

[tool.uv]
package = false
required-version = ">=0.13.9,<0.14"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
