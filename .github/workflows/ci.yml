name: CareTrace CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - run: uv sync --locked --all-packages
      - run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - run: uv run --locked --all-packages mypy apps/api/src apps/api/tests packages/contracts/src packages/contracts/tests infra/migrations
      - name: Test with a disposable pgvector server
        shell: bash
        run: |
          export POSTGRES_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$POSTGRES_PASSWORD"
          db=$(docker run --rm --detach -e POSTGRES_PASSWORD -e POSTGRES_DB=caretrace \
            --publish 127.0.0.1::5432 \
            pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd)
          trap 'docker stop "$db" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$db" pg_isready -h 127.0.0.1 -U postgres -d caretrace; then break; fi
            sleep 1
          done
          port=$(docker port "$db" 5432/tcp | cut -d: -f2)
          export CARETRACE_TEST_POSTGRES_URL="postgresql+psycopg://postgres:$POSTGRES_PASSWORD@127.0.0.1:$port/caretrace"
          uv run --locked --all-packages pytest
      - run: uv build --all-packages --out-dir artifacts/python
      - name: Scan tracked files for private keys and secrets
        run: |
          uv run --locked pre-commit run detect-private-key --all-files
          uv run --locked pre-commit run detect-secrets --all-files

  web:
    name: Web and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm run setup
      - run: pnpm run contracts:check
      - run: pnpm --filter @caretrace/web lint
      - run: pnpm --filter @caretrace/web typecheck
      - run: pnpm --filter @caretrace/web test
      - run: pnpm --filter @caretrace/web build

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
