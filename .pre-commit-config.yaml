repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: Check trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: unsupported
        types: [text]
      - id: detect-private-key
        name: Check for private keys
        entry: uv run --locked detect-private-key
        language: unsupported
        types: [text]
      - id: detect-secrets
        name: Check for secrets
        entry: uv run --locked detect-secrets-hook
        # Exclude package integrity digests and the exact retained public e-Laws digest.
        args:
          - --exclude-lines
          - '^\s*(?:resolution: \{integrity: sha(?:512|1)-[A-Za-z0-9+/=]+\}|integrity: "sha(?:512|1)-[A-Za-z0-9+/=]+"|"original_sha256": "135e6e6e53a287eb05e781ece4cdc33b0de19bde402a15695a617c08da070bef",)\s*$'
        language: unsupported
        types: [text]
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check
        language: unsupported
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check
        language: unsupported
        types: [python]
      - id: web-lint
        name: Web lint and format check
        entry: pnpm --filter @caretrace/web lint
        language: unsupported
        files: ^apps/web/.*\.(ts|tsx|mjs|css|json)$
        pass_filenames: false
