repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: Check trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: unsupported
        types: [text]
      - id: detect-private-key
        name: Check for private keys
        entry: uv run --locked detect-private-key
        language: unsupported
        types: [text]
      - id: detect-secrets
        name: Check for secrets
        entry: uv run --locked detect-secrets-hook
        # Exclude package integrity digests and exact retained public e-Laws digests.
        args:
          - --exclude-lines
          - '^\s*(?:resolution: \{integrity: sha(?:512|1)-[A-Za-z0-9+/=]+\}|integrity: "sha(?:512|1)-[A-Za-z0-9+/=]+"|"original_sha256": "(?:2a8d3102617cf48609c431272fd105ba22c968996099500e27d08af6207fea83|2bed131ed23860db600ddffe67baa4f83bc729c74a5e5fc41311b47b381aee5e)",)\s*$'
        language: unsupported
        types: [text]
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check
        language: unsupported
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check
        language: unsupported
        types: [python]
      - id: web-lint
        name: Web lint and format check
        entry: pnpm --filter @caretrace/web lint
        language: unsupported
        files: ^apps/web/.*\.(ts|tsx|mjs|css|json)$
        pass_filenames: false
